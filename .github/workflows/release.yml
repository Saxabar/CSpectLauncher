# Creates a GitHub Release automatically when a new version is pushed to main.
#
# How it works:
#   1. reads the version from Launcher.ps1 ($AppVersion) and linux/launcher.py (APP_VERSION);
#      the two must be the same, otherwise the run stops with an error;
#   2. if a release v<version> already exists, it does nothing;
#   3. otherwise it builds CSpectLauncher-<version>.zip (Windows) and
#      CSpectLauncher-Linux-<version>.tar.gz (Linux), creates the tag v<version>
#      and publishes the release, with the notes of that version taken from CHANGELOG.md.
#
# To publish a new version: update the version number in both files, add a
# "## <version>" section to CHANGELOG.md and push to main.
# The workflow can also be started by hand from the Actions tab (Run workflow).

name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Launcher.ps1'
      - 'Launcher.bat'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'screenshot.png'
      - 'linux/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          WIN=$(sed -n "s/^\$AppVersion[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" Launcher.ps1 | head -n1)
          LIN=$(sed -n "s/^APP_VERSION[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" linux/launcher.py | head -n1)
          echo "Windows version: $WIN"
          echo "Linux version:   $LIN"
          if [ -z "$WIN" ] || [ -z "$LIN" ]; then
            echo "::error::Version not found in Launcher.ps1 or linux/launcher.py"
            exit 1
          fi
          if [ "$WIN" != "$LIN" ]; then
            echo "::error::Version mismatch: Launcher.ps1 is $WIN, linux/launcher.py is $LIN"
            exit 1
          fi
          echo "version=$WIN" >> "$GITHUB_OUTPUT"

      - name: Check if the release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} already exists: nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        if: steps.check.outputs.exists == 'false'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          # Windows: .bat/.ps1 keep Windows line endings thanks to .gitattributes
          mkdir -p dist/win/CSpectLauncher dist/linux/CSpectLauncher
          cp Launcher.bat Launcher.ps1 README.md LICENSE screenshot.png dist/win/CSpectLauncher/
          (cd dist/win && zip -q -r "../../CSpectLauncher-$V.zip" CSpectLauncher)
          # Linux: scripts executable
          cp linux/launcher.py linux/cspect-launcher.sh linux/README.md linux/screenshot-linux.png LICENSE dist/linux/CSpectLauncher/
          chmod 755 dist/linux/CSpectLauncher/launcher.py dist/linux/CSpectLauncher/cspect-launcher.sh
          tar -C dist/linux --owner=0 --group=0 -czf "CSpectLauncher-Linux-$V.tar.gz" CSpectLauncher
          unzip -l "CSpectLauncher-$V.zip"
          tar -tvzf "CSpectLauncher-Linux-$V.tar.gz"

      - name: Release notes
        if: steps.check.outputs.exists == 'false'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          # section "## <version>" of CHANGELOG.md, up to the next "## "
          awk -v v="$V" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > changes.md || true
          {
            if [ -s changes.md ]; then cat changes.md; echo; fi
            echo "**Downloads**"
            echo
            echo "- **Windows:** \`CSpectLauncher-$V.zip\` - unzip it into a folder and double-click \`Launcher.bat\`."
            echo "- **Linux:** \`CSpectLauncher-Linux-$V.tar.gz\` - see [linux/README.md](https://github.com/$GITHUB_REPOSITORY/blob/v$V/linux/README.md) for the requirements."
            echo
            echo "Requires the CSpect emulator by Mike Dailly: https://mdf200.itch.io/cspect"
          } > notes.md
          cat notes.md

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$V" \
            "CSpectLauncher-$V.zip" \
            "CSpectLauncher-Linux-$V.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CSpect Launcher $V" \
            --notes-file notes.md
